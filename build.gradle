plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.fightingarts'
base { archivesName = 'fighting-arts' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArgument '--username'
            programArgument 'Dev2'
        }
        server { server(); programArgument '--nogui' }
    }
    mods { fightingarts { sourceSet(sourceSets.main) } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
